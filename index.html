<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Date Invitation for Natasha</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c1e;
            --primary: #ff2d55;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --apple-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--apple-font);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 70vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .view {
            position: absolute;
            width: 100%;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .view.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        h2 {
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 17px;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            position: relative;
            min-height: 60px;
        }

        .btn {
            padding: 16px 32px;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-yes {
            background-color: var(--primary);
            color: white;
            flex: 1;
            max-width: 150px;
            box-shadow: 0 8px 20px rgba(255, 45, 85, 0.3);
        }

        .btn-yes:active { transform: scale(0.95); }

        .btn-no {
            background-color: #3a3a3c;
            color: var(--text-main);
            flex: 1;
            max-width: 150px;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="date"], input[type="time"] {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #3a3a3c;
            background-color: #2c2c2e;
            color: var(--text-main);
            font-size: 16px;
            font-family: var(--apple-font);
            -webkit-appearance: none;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        .grid-btn {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 16px;
            padding: 20px 10px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .grid-btn span { font-size: 24px; }
        .grid-btn:active { background: #3a3a3c; transform: scale(0.96); }

        .action-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            margin-top: 15px;
            cursor: pointer;
        }
        .action-btn:active { transform: scale(0.96); }

    </style>
</head>
<body>

    <div class="app-container" id="boundary">
        
        <!-- STEP 1: The Ask -->
        <div class="view active" id="view-ask">
            <!-- INJECTED NATASHA'S NAME HERE -->
            <h2>Hey Natasha ❤️</h2>
            <p class="subtitle">I was wondering... would you like to go on a date with me?</p>
            <div class="btn-container">
                <button class="btn btn-yes" onclick="navigate('view-datetime')">Yes!</button>
                <button class="btn btn-no" id="btn-no">No</button>
            </div>
        </div>

        <!-- STEP 2: Date & Time Selection -->
        <div class="view" id="view-datetime">
            <h2>Set the Schedule</h2>
            <p class="subtitle">When are you free for this date?</p>
            
            <div class="input-group">
                <label>Select Date</label>
                <input type="date" id="dateInput" required>
            </div>
            <div class="input-group">
                <label>Select Time</label>
                <input type="time" id="timeInput" required>
            </div>
            
            <button class="action-btn" onclick="validateDateTime()">Next Step</button>
        </div>

        <!-- STEP 3: Vibe/Venue Selection -->
        <div class="view" id="view-vibe">
            <h2>Select the Vibe</h2>
            <p class="subtitle">What kind of date are we going on?</p>
            
            <div class="grid-2x2">
                <button class="grid-btn" onclick="setVibe('Cozy Cafe ☕')">
                    <span>☕</span> Cafe
                </button>
                <button class="grid-btn" onclick="setVibe('Fancy Restaurant 🍷')">
                    <span>🍷</span> Restaurant
                </button>
                <button class="grid-btn" onclick="setVibe('Clubbing & Drinks 🪩')">
                    <span>🪩</span> Club
                </button>
                <button class="grid-btn" onclick="setVibe('Late Night Long Drive 🚗')">
                    <span>🚗</span> Long Drive
                </button>
            </div>
        </div>

        <!-- STEP 4: WhatsApp Payload Execution -->
        <div class="view" id="view-final">
            <!-- INJECTED NATASHA'S NAME HERE -->
            <h2>It's a Date, Natasha! 🎉</h2>
            <p class="subtitle">Your reservation has been confirmed locally. Transmit the data to your boyfriend to finalize.</p>
            <button class="action-btn" onclick="sendToWhatsApp()">Notify on WhatsApp 📲</button>
        </div>

    </div>

    <script>
        'use strict';

        const dateData = {
            date: '',
            time: '',
            vibe: ''
        };

        function navigate(targetId) {
            document.querySelectorAll('.view').forEach(view => {
                view.classList.remove('active');
            });
            document.getElementById(targetId).classList.add('active');
        }

        const btnNo = document.getElementById('btn-no');
        const boundary = document.getElementById('boundary');

        function moveButton(e) {
            if(e) e.preventDefault(); 
            
            const maxOffsetX = 100; 
            const maxOffsetY = 150; 

            const randomX = (Math.random() * (maxOffsetX * 2)) - maxOffsetX;
            const randomY = (Math.random() * (maxOffsetY * 2)) - maxOffsetY;

            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', moveButton, { passive: false });
        btnNo.addEventListener('click', moveButton); 


        function validateDateTime() {
            const d = document.getElementById('dateInput').value;
            const t = document.getElementById('timeInput').value;
            
            if (!d || !t) {
                alert("Please select both a date and a time!");
                return;
            }
            
            const dateObj = new Date(d);
            const formattedDate = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

            dateData.date = formattedDate;
            dateData.time = t;
            
            navigate('view-vibe');
        }

        function setVibe(selectedVibe) {
            dateData.vibe = selectedVibe;
            navigate('view-final');
        }

        function sendToWhatsApp() {
            const targetPhone = "916398038550"; 
            
            // INJECTED NATASHA'S NAME INTO THE PAYLOAD
            const message = `Hey babe! It's Natasha, and it's a YES for the date! ❤️\n\n📅 Date: *${dateData.date}*\n⏰ Time: *${dateData.time}*\n📍 Vibe: *${dateData.vibe}*\n\nCan't wait! 😘`;
            
            const encodedMessage = encodeURIComponent(message);
            const waUrl = `https://wa.me/${targetPhone}?text=${encodedMessage}`;
            
            window.location.href = waUrl;
        }
    </script>
</body>
</html>
